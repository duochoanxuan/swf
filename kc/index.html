<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Kim Cương - thichgame.com</title>
    
    <link rel="stylesheet" type="text/css" href="css/screen.css">
    <link rel="stylesheet" type="text/css" href="css/game.css">

    <style>
        /* --- 1. BIẾN MÀU SẮC & GIAO DIỆN --- */
        :root {
            --bg-body: #000;
            --bg-game: rgba(20, 20, 35, 0.8);
            --text-main: #fff;
            --btn-bg: linear-gradient(180deg, #0624c3 0%, #041a8d 100%);
            --popup-bg: #041a8d;
        }

        /* Chế độ Sáng */
        body.light-mode {
            --bg-body: #b8b8b8;
            --bg-game: rgba(116, 116, 116, 0.9);
            --text-main: #222;
            --btn-bg: linear-gradient(180deg, #444 0%, #222 100%);
            --popup-bg: #333;
        }

        /* --- 2. RESET & LAYOUT --- */
        #time_gauge, #total_score, #current_gauge, #player_info, #game_content {
            background: none !important; border: none !important; box-shadow: none !important;
            float: none !important; position: static !important; margin: 0 !important; padding: 0 !important;
        }

        body {
            margin: 0; padding: 0; background: var(--bg-body);
            display: flex; flex-direction: column; align-items: center;
            overflow: hidden; transition: 0.3s; font-family: sans-serif;
        }

        #scaler {
            width: 1000px; height: 750px;
            position: relative; transform-origin: top center;
        }

        /* Tiêu đề Game */
        .game-title {
            color: #ebff00; font-size: 28px; font-weight: bold;
            text-align: center; margin: 20px 0; text-transform: uppercase;
            text-shadow: 2px 2px 0 #000; letter-spacing: 2px;
        }

        #game_content {
            display: flex !important; flex-direction: row !important;
            justify-content: center !important; align-items: center !important;
            width: 950px !important; height: 600px !important;
            margin: 0 auto !important; background: var(--bg-game) !important;
            border-radius: 15px !important; border: 2px solid rgba(255,255,255,0.1) !important;
        }

        /* --- 3. VẼ LẠI THÀNH PHẦN --- */
        #time_gauge {
            width: 22px !important; height: 525px !important;
            background: rgba(0, 0, 0, 0.5) !important;
            border: 2px solid #444 !important; border-radius: 12px !important;
            margin-right: 25px !important; position: relative !important; overflow: hidden !important;
        }
        #current_gauge {
            background: linear-gradient(to top, #00ff00, #adff2f) !important;
            width: 100% !important; position: absolute !important; bottom: 0 !important;
            box-shadow: 0 0 15px #00ff00;
        }

        #grid {
            width: 525px !important; height: 525px !important;
            position: relative !important; background: rgba(0, 0, 0, 0.3) !important;
            border: 4px solid #333 !important;
        }

        #player_info {
            width: 250px !important; margin-left: 25px !important;
            display: flex !important; flex-direction: column !important; align-items: center !important;
        }

        /* KHÓA CHẶT KHUNG ĐIỂM - CHỐNG NHẢY KHUNG */
        #total_score {
            width: 150px !important; height: 150px !important;
            background: radial-gradient(circle, #2a2a2a, #000) !important;
            border: 5px solid #ebff00 !important; border-radius: 50% !important;
            display: flex !important; flex-direction: column !important; justify-content: center !important;
            align-items: center !important; box-shadow: 0 0 20px rgba(235, 255, 0, 0.3) !important;
            margin: 15px 0 !important; 
            position: relative !important; /* Làm gốc cho điểm cộng bay */
            flex-shrink: 0 !important; /* Không cho co lại */
            overflow: visible !important; /* Cho phép điểm bay ra ngoài vòng tròn */
        }

        #current_score {
            color: #ebff00 !important; font-size: 34px !important;
            font-weight: bold !important; text-shadow: 0 0 10px rgba(235, 255, 0, 0.5);
        }

        /* ĐIỂM CỘNG: HIỂN THỊ ĐÈ LÊN, KHÔNG CHIẾM DIỆN TÍCH */
        .score_gain {
            position: absolute !important; 
            left: 80% !important;
            top: 27% !important;
            transform: translate(-50%, -50%) !important;
            z-index: 100 !important;
            pointer-events: none;
            margin: 0 !important;
            white-space: nowrap;
            animation: scoreFly 1s ease-out forwards !important;
        }

        @keyframes scoreFly {
            0% { opacity: 1; transform: translate(-50%, -50%); }
            100% { opacity: 0; transform: translate(-50%, -150%); }
        }

        /* Thiết kế nút bấm mới */
        .btn-custom {
            width: 160px !important; height: 45px !important;
            margin: 8px 0 !important; border-radius: 25px !important;
            background: var(--btn-bg) !important; color: #fff !important;
            border: 2px solid rgba(255,255,255,0.2) !important;
            font-weight: bold !important; cursor: pointer !important;
            font-size: 14px !important; text-transform: uppercase;
            box-shadow: 0 4px 0 #000; transition: 0.1s;
            flex-shrink: 0;
        }
        .btn-custom:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }

        /* Nút đổi màu nền */
        .theme-toggle {
            position: absolute; top: 10px; right: 20px;
            padding: 8px 15px; background: #ebff00; color: #000;
            border-radius: 5px; font-weight: bold; cursor: pointer; z-index: 100;
        }

        /* --- 4. SỬA THÔNG BÁO (POPUP) --- */
        .popup { z-index: 9999 !important; }
        .popup div {
            background: var(--popup-bg) !important;
            color: #fff !important;
            border: 4px solid #ebff00 !important;
            border-radius: 20px !important;
            padding: 30px !important;
            text-align: center !important;
            box-shadow: 0 0 50px rgba(0,0,0,0.9) !important;
        }
        .popup h2, .popup p { margin-bottom: 20px !important; font-size: 20px !important; }
        .popup button {
            background: #ebff00 !important;
            color: #000 !important;
            font-weight: bold !important;
            padding: 12px 30px !important;
            border-radius: 30px !important;
            border: none !important;
            cursor: pointer !important;
            font-size: 16px !important;
            text-transform: uppercase !important;
        }
    </style>
</head>
<body>

    <div class="theme-toggle" onclick="document.body.classList.toggle('light-mode')">SÁNG / TỐI</div>

    <div id="scaler">
        <div class="game-title">Game Kim Cương - thichgame.com</div>
        
        <div id="content">
            <div id="game_content">
                <div id="time_gauge">
                    <div id="current_gauge"></div>
                </div>

                <div id="grid"></div>

                <div id="player_info">
                    <div style="color: #adff2f; font-size: 22px; font-weight: bold; letter-spacing: 1px;">
                        CẤP ĐỘ: <span id="level">1</span>
                    </div>
                    
                    <div id="total_score">
                        <div style="color: #888; font-size: 11px; margin-bottom: 5px;">ĐIỂM</div>
                        <span id="current_score">0</span>
                    </div>
                    
                    <div style="color: var(--text-main); font-size: 15px; margin-bottom: 15px; font-weight: bold;">
                        MỤC TIÊU: <span id="goal_score">5000</span>
                    </div>

                    <button id="restart_bt" class="btn-custom" onclick="location.reload()">CHƠI LẠI</button>
                    <button id="pause_bt" class="btn-custom">TẠM DỪNG</button>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="js/util.js"></script>
    <script type="text/javascript" src="js/game/capabilities/item.js"></script>
    <script type="text/javascript" src="js/game/init.js"></script>
    <script type="text/javascript" src="js/game/timer.js"></script>
    <script type="text/javascript" src="js/game/level.js"></script>
    <script type="text/javascript" src="js/game/hint.js"></script>
    <script type="text/javascript" src="js/game/sfx.js"></script>
    <script type="text/javascript" src="js/game/score.js"></script>
    <script type="text/javascript" src="js/game/streak.js"></script>
    <script type="text/javascript" src="js/game/bonus.js"></script>
    <script type="text/javascript" src="js/game/classes/Gem.js"></script>
    <script type="text/javascript" src="js/game/classes/Bomb.js"></script>
    <script type="text/javascript" src="js/game/classes/Popup.js"></script>
    <script type="text/javascript" src="js/game/main.js"></script>

    <script type="text/javascript">
        function autoResize() {
            const scaler = document.getElementById('scaler');
            const winW = window.innerWidth;
            const winH = window.innerHeight;
            const baseW = 1000;
            const baseH = 800; // Tăng baseH để chứa tiêu đề

            let ratio = Math.min(winW / baseW, winH / baseH);
            if (winW >= baseW && winH >= baseH) ratio = 1;

            scaler.style.transform = `scale(${ratio})`;
            const offset = (winH - (baseH * ratio)) / 2;
            scaler.style.top = Math.max(0, offset) + 'px';
        }
        window.addEventListener('resize', autoResize);
        window.addEventListener('load', autoResize);
        autoResize();
    </script>
</body>
</html>
